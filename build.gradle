plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

evaluationDependsOn(':just-mirrors')
evaluationDependsOn(':just-scrying')
evaluationDependsOn(':just-spawn-lanterns')
evaluationDependsOn(':just-silver')
evaluationDependsOn(':just-wither-zombies')

loom {
	splitEnvironmentSourceSets()

	runs {
		client {
			programArgs "--username", "Dev"
		}
	}

	mods {
		"argent" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
		modId = "argent"
	}
}

repositories {
	maven {
		url = "https://maven.terraformersmc.com/releases/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	implementation project(':just-mirrors')
	clientImplementation rootProject.project(':just-mirrors').sourceSets.client.output
	include project(':just-mirrors')
	implementation project(':just-scrying')
	clientImplementation rootProject.project(':just-scrying').sourceSets.client.output
	include project(':just-scrying')
	implementation project(':just-spawn-lanterns')
	clientImplementation rootProject.project(':just-spawn-lanterns').sourceSets.client.output
	include project(':just-spawn-lanterns')
	implementation project(':just-silver')
	clientImplementation rootProject.project(':just-silver').sourceSets.client.output
	include project(':just-silver')
	implementation project(':just-wither-zombies')
	clientImplementation rootProject.project(':just-wither-zombies').sourceSets.client.output
	include project(':just-wither-zombies')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}
